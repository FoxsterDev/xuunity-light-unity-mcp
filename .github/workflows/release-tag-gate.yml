name: Release Tag Gate

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to verify (defaults to the checked-out SHA)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  verify-required-gates:
    name: Verify required gates for the tagged commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify required CI gates are green for this SHA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/testing/check_release_ci_gates.py \
            --sha "${{ inputs.sha || github.sha }}" \
            --wait-seconds 1800
